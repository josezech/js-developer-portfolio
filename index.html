<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <aside class="profile">
      <img id="avatar" class="avatar" alt="Foto de perfil">
      <h1 id="name"></h1>
      <p id="job" class="job"></p>

      <h2>Contato</h2>
      <ul id="contact" class="plain"></ul>

      <h2>Hard Skills</h2>
      <ul id="hardSkills" class="tags"></ul>

      <h2>Soft Skills</h2>
      <ul id="softSkills" class="tags"></ul>

      <h2>Idiomas</h2>
      <ul id="languages" class="plain"></ul>
    </aside>

    <section class="content">
      <h2>Portfólio</h2>
      <div id="portfolio" class="cards"></div>

      <h2>Experiência</h2>
      <div id="experience"></div>
    </section>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
